spring.application.name=deskspace

# No database by default. spring-boot-starter-jdbc is on the classpath so the
# postgres adapter compiles, and its auto-configuration would otherwise try to
# build a DataSource with no URL and fail every context that starts without a
# profile. The postgres profile turns it back on.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
