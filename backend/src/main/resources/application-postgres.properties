# Opt-in persistence. Without this profile the in-memory adapter is used and a
# clone with no Docker goes green.
spring.datasource.url=${DESKSPACE_DB_URL:jdbc:postgresql://localhost:5432/deskspace}
spring.datasource.username=${DESKSPACE_DB_USER:deskspace}
spring.datasource.password=${DESKSPACE_DB_PASSWORD:deskspace}

spring.flyway.enabled=true
# The default, stated because it is the requirement: a migration that has already
# been applied and was then edited stops the application from starting rather
# than silently running against a schema nobody can reproduce.
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Undo the default exclusion: this profile is the one that wants a DataSource.
spring.autoconfigure.exclude=
